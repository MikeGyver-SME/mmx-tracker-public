name: Update MMX telemetry

# Refreshes data/latest.json from JPL Horizons every 30 minutes and
# commits it back to the repo; GitHub Pages then serves the new data.
# Also runnable on demand: Actions tab -> Update MMX telemetry -> Run workflow.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the latest Horizons reading
        run: node scripts/fetch-telemetry.mjs

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No change in telemetry data."
          else
            git commit -m "Telemetry update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
